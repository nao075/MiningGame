<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Mining Rank (Top 10)</title>
    <style>
        body { margin: 0; overflow: hidden; background: transparent; font-family: 'Courier New', 'Meiryo', monospace; color: white; text-shadow: 2px 2px 4px #000; }
        
        #rank-container { 
            position: absolute; 
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: flex-end;
            opacity: 0; /* 最初は透明 */
            transition: opacity 0.5s;
        }

        .scroll-window { position: relative; width: 900px; height: 100vh; overflow: hidden; }
        
        /* アニメーション速度を10位＋余白に合わせて調整 */
        .scroll-content { 
            position: absolute; 
            width: 100%; 
            top: 100%; 
            animation: scroll-up 30s linear infinite; 
        }

        @keyframes scroll-up { 
            0% { top: 100%; } 
            100% { top: -800px; } /* 15行分をカバー */
        }

        .rank-line { height: 50px; line-height: 50px; font-size: 24px; white-space: pre; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; }
        .rank-num { color: #ffd700; font-weight: bold; width: 80px; text-align: right; margin-right: 15px; flex-shrink: 0; }
        .user-name { color: #bf94ff; width: 450px; flex-shrink: 0; overflow: hidden; }
        .user-score { color: #00ffff; text-align: right; flex-grow: 1; }
    </style>
</head>
<body>
    <div id="rank-container">
        <div class="scroll-window">
            <div id="scroll-content" class="scroll-content"></div>
        </div>
    </div>

<script>
const params = new URLSearchParams(window.location.search);
const CHANNEL_NAME = params.get('channel') || 'nao075';
const BOT_NAME = params.get('bot') || '';
const OAUTH_TOKEN = params.get('token') || '';

function formatName(name) {
    if (name.length > 20) return name.substring(0, 19) + '…';
    return name.padEnd(20, ' ');
}

function formatScore(score) {
    const absTotal = Math.abs(score);
    let txt = "";
    if (absTotal >= 100000000) txt = (score / 100000000).toFixed(2) + " 億 G";
    else if (absTotal >= 10000) txt = (score / 10000).toFixed(1) + " 万 G";
    else txt = score.toLocaleString() + " G";
    return txt.padStart(15, ' ');
}

function updateRankDisplay() {
    const content = document.getElementById('scroll-content');
    const userData = JSON.parse(localStorage.getItem('mining_userData')) || {};
    const sorted = Object.values(userData).sort((a, b) => b.balance - a.balance);
    
    let html = "";
    // 10位までに変更
    for (let i = 0; i < 10; i++) {
        if (i < sorted.length) {
            const user = sorted[i];
            html += `<div class="rank-line">
                        <span class="rank-num">${i + 1}位 ：</span>
                        <span class="user-name">${formatName(user.name)}</span>
                        <span class="user-score">${formatScore(user.balance)}</span>
                     </div>`;
        } else {
            html += `<div class="rank-line"></div>`; 
        }
    }
    // 余白を5行
    for (let j = 0; j < 5; j++) html += `<div class="rank-line"></div>`;
    content.innerHTML = html;
}

const socket = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
socket.onopen = () => {
    socket.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    socket.send(`PASS ${OAUTH_TOKEN}`);
    socket.send(`NICK ${BOT_NAME.toLowerCase()}`);
    socket.send(`JOIN #${CHANNEL_NAME.toLowerCase()}`);
};

socket.onmessage = (e) => {
    const d = e.data;
    if (d.startsWith('PING')) { socket.send('PONG :tmi.twitch.tv'); return; }
    
    if (d.includes('PRIVMSG')) {
        const msg = d.split('PRIVMSG')[1].split(' :')[1]?.toLowerCase().trim();
        
        // バッジ情報を取得して、ストリーマー(broadcaster)かどうかを判定
        const badges = d.match(/badges=([^;]+)/)?.[1] || "";
        const isStreamer = badges.includes("broadcaster");

        // ストリーマーのみ実行可能
        if (isStreamer) {
            if (msg === '!end') {
                updateRankDisplay();
                document.getElementById('rank-container').style.opacity = '1';
            } else if (msg === '!notend') {
                document.getElementById('rank-container').style.opacity = '0';
            }
        }
    }
};
</script>
</body>
</html>
