<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Mining Overlay URL Generator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #6441a5; font-size: 1.5em; border-bottom: 2px solid #6441a5; padding-bottom: 10px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em; }
        .hint { font-size: 0.85em; color: #666; margin-top: 5px; }
        
        .result-section { background: #f9f9ff; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-top: 25px; display: none; }
        .url-card { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ccd; margin-bottom: 20px; position: relative; }
        .url-card label { color: #6441a5; font-size: 0.9em; }
        .url-display { 
            word-break: break-all; font-family: monospace; background: #f4f4f4; padding: 10px; 
            border: 1px dashed #6441a5; margin-top: 10px; display: block; font-size: 0.85em;
            max-height: 60px; overflow-y: auto;
        }
        
        .btn-main { background: #6441a5; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 1em; width: 100%; transition: 0.3s; }
        .btn-copy { 
            background: #4caf50; color: white; border: none; padding: 5px 15px; border-radius: 4px; 
            cursor: pointer; font-size: 0.8em; margin-top: 10px; transition: 0.2s;
        }
        .btn-copy:hover { background: #45a049; }
        .btn-copy.done { background: #2196f3; }
        
        button:hover { opacity: 0.9; }
        .warning { color: #d33; font-size: 0.8em; font-weight: bold; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>OBS用URLジェネレーター</h1>
        <p>情報を入力して、各ソース用のURLを作成します。</p>

        <div class="input-group">
            <label>配信チャンネル名 (ID)</label>
            <input type="text" id="channel" value="nao075" placeholder="例: nao075">
        </div>

        <div class="input-group">
            <label>Botのアカウント名 (ID)</label>
            <input type="text" id="bot" placeholder="例: my_mining_bot">
        </div>

        <div class="input-group">
            <label>OAuthトークン</label>
            <input type="password" id="token" placeholder="oauth:xxxxxxxxxxxx">
            <div class="hint"><a href="https://twitchapps.com/tmi/" target="_blank">トークン取得はこちら</a></div>
        </div>

        <button class="btn-main" onclick="generateURLs()">URLを一括生成する</button>

        <div id="result-section" class="result-section">
            <div class="url-card">
                <label>【1】採掘表示用 (index.html)</label>
                <code class="url-display" id="url-index"></code>
                <button class="btn-copy" onclick="copyToClipboard('url-index', this)">URLをコピー</button>
            </div>

            <div class="url-card">
                <label>【2】ランキング用 (rank.html)</label>
                <code class="url-display" id="url-rank"></code>
                <button class="btn-copy" onclick="copyToClipboard('url-rank', this)">URLをコピー</button>
            </div>

            <p class="warning">※トークンが含まれています。URLを配信画面に映さないでください！</p>
        </div>
    </div>

    <script>
        function generateURLs() {
            const channel = document.getElementById('channel').value.trim();
            const bot = document.getElementById('bot').value.trim();
            const token = document.getElementById('token').value.trim();
            
            if(!channel || !bot || !token) {
                alert("すべての項目を入力してください。");
                return;
            }

            const query = `?channel=${encodeURIComponent(channel)}&bot=${encodeURIComponent(bot)}&token=${encodeURIComponent(token)}`;
            const basePath = window.location.href.replace('guide.html', '');
            
            // 各URLをセット
            document.getElementById('url-index').innerText = basePath + 'index.html' + query;
            document.getElementById('url-rank').innerText = basePath + 'rank.html' + query;
            
            document.getElementById('result-section').style.display = 'block';
        }

        async function copyToClipboard(elementId, btn) {
            const text = document.getElementById(elementId).innerText;
            try {
                await navigator.clipboard.writeText(text);
                const originalText = btn.innerText;
                btn.innerText = "コピー完了！";
                btn.classList.add('done');
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.remove('done');
                }, 2000);
            } catch (err) {
                alert("コピーに失敗しました。手動で選択してコピーしてください。");
            }
        }
    </script>
</body>
</html>
