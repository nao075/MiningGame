<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>NAO075 Mining Overlay</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; color: white; text-shadow: 2px 2px 4px #000; }
        #overlay { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .mining-box {
            background: rgba(0, 0, 0, 0.95); padding: 15px 25px; border-radius: 15px; border: 4px solid #6441a5;
            text-align: center; width: 500px; box-sizing: border-box;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0; transform: scale(0.5); line-height: 1.1;
        }
        .mining-box.show { opacity: 1; transform: scale(1); }
        .user-name { color: #bf94ff; font-weight: bold; font-size: 1.5em; margin-bottom: 5px; }
        .item-name { font-size: 2.6em; margin: 5px 0; font-weight: 900; letter-spacing: -1px; }
        .gold { color: #ffd700; text-shadow: 0 0 10px #ffd700; }
        .diamond { color: #00ffff; text-shadow: 0 0 20px #00ffff; }
        .legend { animation: rainbow 2s linear infinite; font-weight: 900; }
        @keyframes rainbow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
        .danger { color: #ff4444; animation: shake 0.2s infinite; }
        @keyframes shake { 0% { transform: translate(2px,2px); } 50% { transform: translate(-2px,-2px); } 100% { transform: translate(0,0); } }
        .abyss { color: #ff00ff; text-shadow: 0 0 20px #ff00ff; animation: shake 0.1s infinite; }
        .value-gain { font-size: 2em; font-weight: bold; margin-bottom: 10px; }
        .minus { color: #ff3333; }
        .total-score-container { background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.2) 100%); border-radius: 12px; padding: 12px; margin-top: 5px; border: 2px solid rgba(255, 255, 255, 0.4); }
        .total-label { font-size: 1.1em; color: #eee; font-weight: bold; margin-bottom: 2px; }
        .total-amount { font-size: 3.8em; font-weight: 900; color: #fff; display: block; letter-spacing: -2px; line-height: 1; }
        .total-unit { font-size: 0.4em; margin-left: 5px; color: #ffd700; }
        .mining-dots { font-size: 2.5em; font-weight: bold; color: #ffd700; margin: 20px 0; min-height: 1.5em; }
    </style>
</head>
<body>
    <div id="overlay"><div id="display-box" class="mining-box">接続中...</div></div>

<script>
const params = new URLSearchParams(window.location.search);
const CHANNEL_NAME = params.get('channel') || 'nao075'; 
const BOT_NAME     = params.get('bot') || ''; 
const OAUTH_TOKEN  = params.get('token') || ''; 
const COOLDOWN_MS  = 10000;
const MAX_MINE     = 10;

let globalLastMine = 0;
let userData = JSON.parse(localStorage.getItem('mining_userData')) || {}; 
let miningList = [];

async function loadData() {
    try {
        const res = await fetch('data.json');
        miningList = await res.json();
    } catch(e) { console.error("JSON Error", e); }
}
loadData();

function lottery() {
    const rand = Math.random() * 100;
    let rank = 1, cum = 0;
    const chances = { 1: 55, 2: 25, 3: 12, 4: 6, 5: 2 };
    for (const r in chances) {
        cum += chances[r];
        if (rand < cum) { rank = parseInt(r); break; }
    }
    const items = miningList.filter(i => i.rank === rank);
    return items.length ? items[Math.floor(Math.random() * items.length)] : miningList[0];
}

const socket = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
socket.onopen = () => {
    socket.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    socket.send(`PASS ${OAUTH_TOKEN}`);
    socket.send(`NICK ${BOT_NAME.toLowerCase()}`);
    socket.send(`JOIN #${CHANNEL_NAME.toLowerCase()}`);
};

socket.onmessage = (e) => {
    const d = e.data;
    if (d.startsWith('PING')) { socket.send('PONG :tmi.twitch.tv'); return; }

    if (d.includes('PRIVMSG')) {
        const parts = d.split('PRIVMSG');
        if (parts.length < 2) return;
        
        const msg = parts[1].split(' :')[1]?.toLowerCase().trim();
        const name = d.match(/display-name=([^;]+)/)?.[1] || d.split('!')[0].substring(1);
        const uid = d.match(/user-id=([^;]+)/)?.[1];
        const tags = d.match(/badges=([^;]+)/)?.[1] || "";
        const isStreamer = tags.includes("broadcaster");

        if (isStreamer && msg === '!resetall') {
            userData = {};
            localStorage.removeItem('mining_userData');
            socket.send(`PRIVMSG #${CHANNEL_NAME} :全ての採掘データ（所持金・回数）をリセットしました。`);
            return;
        }

        if ((msg === '!mine' || msg === '!m') && miningList.length) {
            const now = Date.now();
            if (!userData[uid]) {
                userData[uid] = { name: name, balance: 0, count: 0, lastReset: now };
            }

            const oneDay = 24 * 60 * 60 * 1000;
            if (now - (userData[uid].lastReset || 0) > oneDay) {
                userData[uid].count = 0;
                userData[uid].lastReset = now;
            }

            if (userData[uid].count >= MAX_MINE) {
                socket.send(`PRIVMSG #${CHANNEL_NAME} :@${name} さん、本日の採掘限界（${MAX_MINE}回）に達しました。`);
                return;
            }

            if (now - globalLastMine < COOLDOWN_MS) {
                const timeLeft = Math.ceil((COOLDOWN_MS - (now - globalLastMine)) / 1000);
                socket.send(`PRIVMSG #${CHANNEL_NAME} :@${name} さん、あと ${timeLeft} 秒お待ちください。`);
                return;
            }

            globalLastMine = now;
            userData[uid].count++;
            socket.send(`PRIVMSG #${CHANNEL_NAME} :${name} さん ${userData[uid].count} 回目の採掘です（${userData[uid].count}/${MAX_MINE}）`);
            startMiningProcess(name, uid);
        }
    }
};

function startMiningProcess(name, uid) {
    const box = document.getElementById('display-box');
    box.classList.remove('show');
    
    setTimeout(() => {
        box.innerHTML = `<div class="user-name">${name}</div><div class="mining-dots">・採掘中</div>`;
        box.classList.add('show');
        
        setTimeout(() => { box.innerHTML = `<div class="user-name">${name}</div><div class="mining-dots">・・採掘中</div>`; }, 1000);
        setTimeout(() => { box.innerHTML = `<div class="user-name">${name}</div><div class="mining-dots">・・・採掘中</div>`; }, 2000);

        setTimeout(() => {
            const item = lottery();
            userData[uid].balance += item.value;
            userData[uid].name = name; 
            localStorage.setItem('mining_userData', JSON.stringify(userData));
            
            // Botに結果を報告させる
            const resultMsg = `${item.item} を手に入れた！（${item.value.toLocaleString()} G）`;
            socket.send(`PRIVMSG #${CHANNEL_NAME} :@${name} さん、${resultMsg}`);
            
            showResult(name, item, userData[uid].balance);
            setTimeout(() => { box.classList.remove('show'); }, 4000);
        }, 3000);
    }, 100);
}

function showResult(name, item, currentTotal) {
    const box = document.getElementById('display-box');
    const isLoss = item.value < 0;
    const valText = isLoss ? `<span class="minus">${item.value.toLocaleString()} G</span>` : `+${item.value.toLocaleString()} G`;
    
    let displayTotal = "";
    const absTotal = Math.abs(currentTotal);
    if (absTotal >= 100000000) displayTotal = (currentTotal / 100000000).toFixed(2) + " 億";
    else if (absTotal >= 10000) displayTotal = (currentTotal / 10000).toFixed(1) + " 万";
    else displayTotal = currentTotal.toLocaleString();

    box.innerHTML = `
        <div class="user-name">${name}</div>
        <div class="item-name ${item.class}">${isLoss ? '💀' : (item.rank >= 4 ? '💎' : '⛏️')} ${item.item}</div>
        <div class="value-gain">${item.value === 0 ? "ハズレ" : valText}</div>
        <div class="total-score-container">
            <div class="total-label">現在の総資産</div>
            <div class="total-amount" style="${currentTotal < 0 ? 'color: #ff6666;' : ''}">
                ${displayTotal}<span class="total-unit">G</span>
            </div>
        </div>`;
}
</script>
</body>
</html>
